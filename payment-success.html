<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment complete — Sideline</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<style>
  :root { --green:#22C55E; --green-soft:#F0FDF4; --dark:#111827; --grey:#6B7280; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color:var(--dark); background:#fff;
    min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .card { max-width:380px; }
  .logo-mark { height:56px; width:auto; margin-bottom:20px; }
  .icon { width:56px; height:56px; border-radius:50%; background:var(--green-soft); display:flex; align-items:center;
    justify-content:center; margin:0 auto 20px; }
  h1 { font-size:22px; margin-bottom:10px; }
  p { color:var(--grey); font-size:15px; line-height:1.55; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo-mark" src="assets/logo-mark.png" alt="Sideline logo">
    <h1>Payment complete</h1>
    <p>Your payment went through and Sideline is now holding the deal amount until the work is done. You can close this tab and head back to the Sideline app to see the update.</p>
  </div>
</body>
</html>
