<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Sideline</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<style>
  :root { --green:#22C55E; --green-dark:#16A34A; --dark:#111827; --grey:#6B7280; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color:var(--dark); background:#fff;
    min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .card { max-width:380px; }
  .logo-mark { height:56px; width:auto; margin-bottom:20px; }
  .code { color:var(--green); font-weight:700; font-size:14px; letter-spacing:1.5px; margin-bottom:8px; }
  h1 { font-size:24px; margin-bottom:10px; }
  p { color:var(--grey); font-size:15px; line-height:1.55; margin-bottom:24px; }
  a.btn { display:inline-block; background:var(--green); color:#fff; text-decoration:none; font-weight:600;
    border-radius:12px; padding:12px 24px; }
  a.btn:hover { background:var(--green-dark); }
</style>
</head>
<body>
  <div class="card">
    <img class="logo-mark" src="/assets/logo-mark.png" alt="Sideline logo">
    <div class="code">404</div>
    <h1>We couldn't find that page</h1>
    <p>The link may be broken or the page may have moved.</p>
    <a class="btn" href="/">Back to Sideline</a>
  </div>
</body>
</html>
